name: Replace Token and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Replace placeholder with real token
        run: sed -i "s/___AIRTABLE_TOKEN___/${{ secrets.AIRTABLE_TOKEN }}/g" index.html

      - name: Show diff (for debugging)
        run: git diff index.html

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "Auto-replace token" || echo "No changes to commit"
          git push origin main
