    .product-desc { font-size:0.85rem; color:#9aa0b0; margin-bottom:6px; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
    .product-server { font-size:0.8rem; color:#6b7280; margin-bottom:10px; }
    .product-footer { display:flex; justify-content:space-between; align-items:center; margin-top:auto; }
    .price { font-size:1.35rem; font-weight:800; color:#f87171; }
    .btn-sm { background:#212833; border:none; color:#e8edf2; padding:6px 14px; border-radius:30px; font-size:0.8rem; font-weight:600; cursor:pointer; transition:background 0.2s; }

    .detail-layout { display:flex; flex-wrap:wrap; gap:28px; }

    .main-img { width:100%; border-radius:18px; margin-bottom:12px; aspect-ratio:16/10; object-fit:cover; background:#1e232b; }
    .thumb-list { display:flex; gap:10px; overflow-x:auto; }

    .user-menu button:hover { background:#d4942b; color:#0c0f15; }
    /* 弹窗 */
    .modal-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.8); z-index:1001; align-items:center; justify-content:center; }
    .modal-overlay.active { display:flex; }
    .modal { background:#161b22; border-radius:24px; padding:32px; width:90%; max-width:420px; position:relative; }
    .modal h2 { margin-bottom:20px; }
    .modal input, .modal select { width:100%; padding:12px 16px; margin-bottom:16px; background:#0c0f15; border:1px solid #2e3540; color:#e8edf2; border-radius:12px; font-size:1rem; outline:none; }
    .modal input:focus, .modal select:focus { border-color:#d4942b; }

    .modal .close-btn { position:absolute; top:16px; right:20px; background:none; border:none; color:#6b7280; font-size:1.5rem; cursor:pointer; }
    /* 头像上传 */

    @media (max-width:640px) { .navbar { height:auto; padding:12px 16px; gap:8px; } .search-box { width:100%; max-width:100%; } .product-grid { grid-template-columns:1fr; } .float-sell-btn { bottom:20px; right:20px; padding:12px 20px; font-size:1rem; } }
  </style>
</head>
<body>

  <script>
    // ================= Airtable 配置 ==================
    const AIRTABLE_CONFIG = {
      baseId: 'appHghJgUFfWnqFaU',
      token: 'patM1jbcaFgZQVDru.a3b8d16f90f9e5dee9f6a5516a48e0b33563e2adf8f3bfe6d9b421505c68772f',   // ⚠️ 替换成你自己的读写 Token
    };
    const TABLE_PRODUCTS = 'products';
    const TABLE_USERS = 'users';
    const API_URL_PRODUCTS = `https://api.airtable.com/v0/${AIRTABLE_CONFIG.baseId}/${encodeURIComponent(TABLE_PRODUCTS)}`;
    const API_URL_USERS = `https://api.airtable.com/v0/${AIRTABLE_CONFIG.baseId}/${encodeURIComponent(TABLE_USERS)}`;

    const SALT = 'zhuran_2026_salt';

    let products = [];
    let currentUser = null; // 当前登录的用户名
    let currentUserRecord = null; // 当前用户的 Airtable 记录

    // ================= 密码哈希 ==================
    async function sha256(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function hashPassword(password) { return await sha256(password + SALT); }
    async function hashAnswer(answer) { return await sha256(answer.toLowerCase() + SALT); }

    // ================= 用户管理 =================
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const userAvatar = document.getElementById('userAvatar');
    const userName = document.getElementById('userName');
    const authModal = document.getElementById('authModal');
    const closeAuthModal = document.getElementById('closeAuthModal');
    const modalTitle = document.getElementById('modalTitle');
    const authAccount = document.getElementById('authAccount');
    const authPassword = document.getElementById('authPassword');
    const authConfirmPassword = document.getElementById('authConfirmPassword');
    const authQuestion = document.getElementById('authQuestion');
    const authAnswer = document.getElementById('authAnswer');
    const forgotQuestionDisplay = document.getElementById('forgotQuestionDisplay');
    const authSubmitBtn = document.getElementById('authSubmitBtn');
    const toggleMode = document.getElementById('toggleMode');
    const forgotPwd = document.getElementById('forgotPwd');
    const authError = document.getElementById('authError');

    const profileModal = document.getElementById('profileModal');
    const closeProfileModal = document.getElementById('closeProfileModal');
    const profileAvatarPreview = document.getElementById('profileAvatarPreview');
    const profileNickname = document.getElementById('profileNickname');
    const saveProfileBtn = document.getElementById('saveProfileBtn');
    const uploadAvatarBtn = document.getElementById('uploadAvatarBtn');
    const avatarFileInput = document.getElementById('avatarFileInput');
    const profileError = document.getElementById('profileError');

    let authMode = 'login';
    let forgotUsername = '';
    let tempAvatarFile = null; // 暂存用户选择的头像文件

    // 更新导航栏用户状态
    async function updateUIBasedOnUser() {
      if (!loginBtn || !userName || !logoutBtn || !userAvatar) return;
      if (currentUser) {
        loginBtn.style.display = 'none';
        userName.style.display = 'inline';
        userAvatar.style.display = 'inline';
        logoutBtn.style.display = 'inline';
        // 加载用户详细信息（昵称、头像）
        const record = await findUser(currentUser);
        if (record) {
          currentUserRecord = record;
          const nick = record.fields['昵称'] || currentUser;
          userName.textContent = nick;
          userName.title = '点击查看个人资料';
          const avatarField = record.fields['头像'];
          if (avatarField && avatarField.length > 0) {
            userAvatar.src = avatarField[0].url;
          } else {
            userAvatar.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23212833'/%3E%3Ctext x='50' y='65' text-anchor='middle' fill='%23f0c060' font-size='40'%3E👤%3C/text%3E%3C/svg%3E";
          }
        }
        // 点击头像或昵称打开个人资料弹窗
        userAvatar.onclick = openProfileModal;
        userName.onclick = openProfileModal;
      } else {
        loginBtn.style.display = 'inline';
        userName.style.display = 'none';
        userAvatar.style.display = 'none';
        logoutBtn.style.display = 'none';
      }
    }

    function resetAuthModal(mode) {
      authError.style.display = 'none';
      authMode = mode;
      authPassword.style.display = 'none';
      authConfirmPassword.style.display = 'none';
      authQuestion.style.display = 'none';
      authAnswer.style.display = 'none';
      forgotQuestionDisplay.style.display = 'none';
      authAccount.style.display = 'block';
      forgotPwd.style.display = 'none';

      if (mode === 'login') {
        modalTitle.textContent = '登录';
        authPassword.style.display = 'block';
        authSubmitBtn.textContent = '登录';
        toggleMode.textContent = '还没有账号？去注册';
        forgotPwd.style.display = 'block';
      } else if (mode === 'register') {
        modalTitle.textContent = '注册';
        authPassword.style.display = 'block';
        authConfirmPassword.style.display = 'block';
        authQuestion.style.display = 'block';
        authAnswer.style.display = 'block';
        authSubmitBtn.textContent = '注册';
        toggleMode.textContent = '已有账号？去登录';
        forgotPwd.style.display = 'none';
      } else if (mode === 'forgot') {
        modalTitle.textContent = '找回密码';
        authPassword.style.display = 'none';
        authConfirmPassword.style.display = 'none';
        authSubmitBtn.textContent = '下一步';
        toggleMode.textContent = '返回登录';
        forgotPwd.style.display = 'none';
      }

      authAccount.value = '';
      authPassword.value = '';
      authConfirmPassword.value = '';
      authQuestion.value = '';
      authAnswer.value = '';
      forgotQuestionDisplay.textContent = '';
    }

    loginBtn.addEventListener('click', () => { resetAuthModal('login'); authModal.classList.add('active'); });
    closeAuthModal.addEventListener('click', () => { authModal.classList.remove('active'); });
    toggleMode.addEventListener('click', () => {
      if (authMode === 'login') resetAuthModal('register');
      else if (authMode === 'register') resetAuthModal('login');
      else if (authMode === 'forgot') resetAuthModal('login');
    });
    forgotPwd.addEventListener('click', () => { resetAuthModal('forgot'); });

    // 查找用户
    async function findUser(username) {
      const formula = encodeURIComponent(`{用户名}="${username}"`);
      const url = `${API_URL_USERS}?filterByFormula=${formula}&maxRecords=1`;
      const res = await fetch(url, {
        headers: { 'Authorization': `Bearer ${AIRTABLE_CONFIG.token}` }
      });
      if (!res.ok) return null;
      const data = await res.json();
      return data.records.length > 0 ? data.records[0] : null;
    }

    // 认证提交
    authSubmitBtn.addEventListener('click', async () => {
      authError.style.display = 'none';
      const account = authAccount.value.trim();
      if (!account || account.length < 8 || account.length > 16) {
        authError.textContent = '账号必须为8-16位';
        authError.style.display = 'block';
        return;
      }

      if (authMode === 'login') {
        const password = authPassword.value;
        if (!password) { authError.textContent = '请输入密码'; authError.style.display = 'block'; return; }
        if (!/[a-zA-Z]/.test(password) || !/[0-9]/.test(password)) {
          authError.textContent = '密码必须包含英文和数字';
          authError.style.display = 'block';
          return;
        }
        const record = await findUser(account);
        if (!record) { authError.textContent = '账号不存在'; authError.style.display = 'block'; return; }
        const hashedPassword = await hashPassword(password);
        if (record.fields['密码'] !== hashedPassword) {
          authError.textContent = '密码错误'; authError.style.display = 'block';
          return;
        }
        currentUser = account;
        authModal.classList.remove('active');
        await updateUIBasedOnUser();

      } else if (authMode === 'register') {
        const password = authPassword.value;
        const confirmPassword = authConfirmPassword.value;
        if (!password || password.length < 6) { authError.textContent = '密码至少6位'; authError.style.display = 'block'; return; }
        if (!/[a-zA-Z]/.test(password) || !/[0-9]/.test(password)) {
          authError.textContent = '密码必须包含英文和数字';
          authError.style.display = 'block';
          return;
        }
        if (password !== confirmPassword) { authError.textContent = '两次密码不一致'; authError.style.display = 'block'; return; }
        const question = authQuestion.value;
        const answer = authAnswer.value.trim();
        if (!question || !answer) { authError.textContent = '请选择密保问题并填写答案'; authError.style.display = 'block'; return; }
        const existRecord = await findUser(account);
        if (existRecord) { authError.textContent = '账号已被注册'; authError.style.display = 'block'; return; }

        const hashedPassword = await hashPassword(password);
        const hashedAnswer = await hashAnswer(answer);
        const body = {
          records: [{
            fields: {
              '用户名': account,
              '密码': hashedPassword,
              '密保问题': question,
              '密保答案': hashedAnswer,
              '昵称': account,  // 默认昵称与账号相同
              '头像': []
            }
          }]
        };
        const res = await fetch(API_URL_USERS, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${AIRTABLE_CONFIG.token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(body)
        });
        if (!res.ok) { authError.textContent = '注册失败，请稍后重试'; authError.style.display = 'block'; return; }
        currentUser = account;
        authModal.classList.remove('active');
        await updateUIBasedOnUser();

      } else if (authMode === 'forgot') {
        if (!forgotUsername) {
          const record = await findUser(account);
          if (!record) { authError.textContent = '账号不存在'; authError.style.display = 'block'; return; }
          forgotUsername = account;
          authAccount.style.display = 'none';
          authPassword.style.display = 'none';
          authSubmitBtn.textContent = '验证答案';
          forgotQuestionDisplay.style.display = 'block';
          forgotQuestionDisplay.textContent = '密保问题：' + record.fields['密保问题'];
          authAnswer.style.display = 'block';
          authError.style.display = 'none';
        } else {
          const answer = authAnswer.value.trim();
          if (!answer) { authError.textContent = '请输入密保答案'; authError.style.display = 'block'; return; }
          const record = await findUser(forgotUsername);
          if (!record) { authError.textContent = '账号异常'; authError.style.display = 'block'; return; }
          const hashedAnswer = await hashAnswer(answer);
          if (record.fields['密保答案'] !== hashedAnswer) {
            authError.textContent = '密保答案错误'; authError.style.display = 'block';
            return;
          }
          authPassword.style.display = 'block';
          authConfirmPassword.style.display = 'block';
          authAnswer.style.display = 'none';
          authSubmitBtn.textContent = '重置密码';
          modalTitle.textContent = '重置密码';
          authMode = 'resetPassword';
          authError.style.display = 'none';
        }
      } else if (authMode === 'resetPassword') {
        const newPassword = authPassword.value;
        const confirmNewPassword = authConfirmPassword.value;
        if (!newPassword || !/[a-zA-Z]/.test(newPassword) || !/[0-9]/.test(newPassword)) {
          authError.textContent = '密码必须包含英文和数字'; authError.style.display = 'block'; return;
        }
        if (newPassword !== confirmNewPassword) { authError.textContent = '两次密码不一致'; authError.style.display = 'block'; return; }
        const record = await findUser(forgotUsername);
        if (!record) { authError.textContent = '用户不存在'; authError.style.display = 'block'; return; }
        const hashedPassword = await hashPassword(newPassword);
        const updateUrl = `https://api.airtable.com/v0/${AIRTABLE_CONFIG.baseId}/${encodeURIComponent(TABLE_USERS)}/${record.id}`;
        const res = await fetch(updateUrl, {
          method: 'PATCH',
          headers: {
            'Authorization': `Bearer ${AIRTABLE_CONFIG.token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ fields: { '密码': hashedPassword } })
        });
        if (!res.ok) { authError.textContent = '重置失败，请稍后重试'; authError.style.display = 'block'; return; }
        alert('密码重置成功，请重新登录');
        authModal.classList.remove('active');
        forgotUsername = '';
        currentUser = null;
        await updateUIBasedOnUser();
      }
    });

    // 退出
    logoutBtn.addEventListener('click', () => {
      currentUser = null;
      currentUserRecord = null;
      updateUIBasedOnUser();
    });

    // ================= 个人资料弹窗 =================
    function openProfileModal() {
      if (!currentUserRecord) return;
      profileNickname.value = currentUserRecord.fields['昵称'] || '';
      const avatar = currentUserRecord.fields['头像'];
      if (avatar && avatar.length > 0) {
        profileAvatarPreview.src = avatar[0].url;
      } else {
        profileAvatarPreview.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23212833'/%3E%3Ctext x='50' y='65' text-anchor='middle' fill='%23f0c060' font-size='40'%3E👤%3C/text%3E%3C/svg%3E";
      }
      profileModal.classList.add('active');
    }

    closeProfileModal.addEventListener('click', () => profileModal.classList.remove('active'));

    uploadAvatarBtn.addEventListener('click', () => avatarFileInput.click());

    avatarFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        tempAvatarFile = file;
        const reader = new FileReader();
        reader.onload = (ev) => { profileAvatarPreview.src = ev.target.result; };
        reader.readAsDataURL(file);
      }
    });

    saveProfileBtn.addEventListener('click', async () => {
      if (!currentUserRecord) return;
      profileError.style.display = 'none';
      const nickname = profileNickname.value.trim() || currentUser;
      const fields = { '昵称': nickname };

      // 如果有新头像，上传到 Airtable 的附件字段
      if (tempAvatarFile) {
        // Airtable 附件上传需要 multipart/form-data
        const formData = new FormData();
        formData.append('file', tempAvatarFile);
        // 先上传到 Airtable 的临时附件端点
        const uploadUrl = `https://api.airtable.com/v0/${AIRTABLE_CONFIG.baseId}/${encodeURIComponent(TABLE_USERS)}/${currentUserRecord.id}/fields/头像/upload`;
        try {
          const uploadRes = await fetch(uploadUrl, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${AIRTABLE_CONFIG.token}` },
            body: formData
          });
          if (!uploadRes.ok) throw new Error('头像上传失败');
          const uploadData = await uploadRes.json();
          fields['头像'] = [{ id: uploadData.id, url: uploadData.url, filename: uploadData.filename }];
        } catch (err) {
          profileError.textContent = '头像上传失败，请稍后重试';
          profileError.style.display = 'block';
          return;
        }
      }

      // 更新用户记录
      const updateUrl = `https://api.airtable.com/v0/${AIRTABLE_CONFIG.baseId}/${encodeURIComponent(TABLE_USERS)}/${currentUserRecord.id}`;
      const res = await fetch(updateUrl, {
        method: 'PATCH',
        headers: {
          'Authorization': `Bearer ${AIRTABLE_CONFIG.token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ fields })
      });
      if (!res.ok) {
        profileError.textContent = '保存失败，请稍后重试';
        profileError.style.display = 'block';
        return;
      }
      // 更新本地数据
      currentUserRecord.fields['昵称'] = nickname;
      if (fields['头像']) currentUserRecord.fields['头像'] = fields['头像'];
      await updateUIBasedOnUser();
      profileModal.classList.remove('active');
      tempAvatarFile = null;
    });

    // ================= 商品加载 ==================
    async function loadProducts() {
      try {
        const res = await fetch(API_URL_PRODUCTS, {
          headers: { 'Authorization': `Bearer ${AIRTABLE_CONFIG.token}` }
        });
        if (!res.ok) throw new Error('网络请求失败');
        const data = await res.json();
        products = data.records.map(record => {
          const f = record.fields;
          const mainImg = (f['主图'] && f['主图'][0]) ? f['主图'][0].url : 'https://placehold.co/700x420/1a1f2b/f0c060?text=暂无图片';
          const otherImgs = (f['其他图片'] || []).map(img => img.url);
          return {
            id: f['编号'] || '无编号',
            recordId: record.id,
            title: f['标题'] || '无标题',
            desc: f['描述'] || '',
            price: f['价格'] || 0,
            server: f['区服'] || '未知区服',
            highestBid: f['最高出价'] || 0,
            images: [mainImg, ...otherImgs]
          };
        });
        renderHome();
        if (window.location.hash) handleHashChange();
        else window.location.hash = '#/';
      } catch (err) {
        console.error(err);
        document.getElementById('productGrid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#6b7280;">数据加载失败，请稍后重试</div>';
      }
    }

    const homePage = document.getElementById('homePage');
    const detailPage = document.getElementById('detailPage');
    const productGrid = document.getElementById('productGrid');
    const totalCountSpan = document.getElementById('totalCount');
    const searchInput = document.getElementById('searchInput');
    const detailContent = document.getElementById('detailContent');
    const backBtn = document.getElementById('backBtn');
    const sellBtn = document.getElementById('sellBtn');

    sellBtn.addEventListener('click', () => {
      if (!currentUser) {
        alert('请先登录后再卖账号');
        resetAuthModal('login');
        authModal.classList.add('active');
        return;
      }
      alert('请联系客服微信：csy212886226 办理卖账号业务');
    });

    function truncate(str, len=30) { return str && str.length > len ? str.slice(0,len)+'...' : str||''; }
    let currentRoute = 'home', currentProductId = null;

    function renderHome(filterText='') {
      const kw = filterText.trim().toLowerCase();
      const filtered = products.filter(p => !kw || p.id.toLowerCase().includes(kw) || p.title.toLowerCase().includes(kw) || p.desc.toLowerCase().includes(kw) || (p.server||'').toLowerCase().includes(kw));
      totalCountSpan.textContent = filtered.length;
      if (!filtered.length) { productGrid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#6b7280;">没有找到匹配的账号</div>'; return; }
      productGrid.innerHTML = filtered.map(p => {
        const displayId = p.id.toString().padStart(2, '0'); // 自动补零
        return `
          <div class="product-card" data-product-id="${p.id}">
            <div class="card-img"><img src="${p.images[0]}" alt="${displayId}"></div>
            <div class="card-body">
              <div class="product-id">📌 ${displayId}</div>
              <div class="product-title">${truncate(p.title)}</div>
              <div class="product-desc">${truncate(p.desc)}</div>
              <div class="product-server">🌐 ${p.server}</div>
              <div class="product-footer"><span class="price">¥${p.price}</span><button class="btn-sm">查看详情</button></div>
            </div>
          </div>
        `;
      }).join('');
      document.querySelectorAll('.product-card').forEach(c => c.addEventListener('click', () => navigateToDetail(c.dataset.productId)));
    }

    function renderDetail(pid) {
      const p = products.find(x => x.id === pid);
      if (!p) { navigateToHome(); return; }
      currentProductId = pid;
      const images = p.images || [];
      const mainImg = images[0] || 'https://placehold.co/700x420/1a1f2b/f0c060?text=暂无图片';
      const thumbs = images.map((img,i) => `<img src="${img}" class="thumb ${i===0?'active':''}" data-index="${i}" alt="缩略图">`).join('');
      const currentBid = p.highestBid || 0;
      const bidDisplay = currentBid > 0 ? `¥${currentBid}` : '暂无出价';
      const displayId = p.id.toString().padStart(2, '0');

      detailContent.innerHTML = `
        <div class="detail-gallery">
          <img src="${mainImg}" class="main-img" id="mainImg" alt="${displayId}">
          <div class="thumb-list" id="thumbList">${thumbs}</div>
        </div>
        <div class="detail-info">
          <h1>${truncate(p.title)}</h1>
          <div class="detail-price">¥${p.price}</div>
          <div class="bid-section">
            <div class="bid-current">当前最高出价：<span id="currentBid">${bidDisplay}</span></div>
            <div class="bid-form">
              <input type="number" id="bidInput" placeholder="输入你的出价" min="1" step="0.01">
              <button id="submitBidBtn">我要出价</button>
            </div>
            <div class="bid-error" id="bidError"></div>
          </div>
          <div class="detail-desc">${p.desc}</div>
          <div class="detail-meta">
            <div class="meta-item"><div class="label">商品编号</div><div class="value">${displayId}</div></div>
            <div class="meta-item"><div class="label">所在区服</div><div class="value">${p.server}</div></div>
          </div>
          <button class="buy-btn" id="buyBtn">💬 联系客服购买</button>
          <div class="contact-row"><span>📱 客服微信：csy212886226</span></div>
        </div>
      `;

      // 绑定缩略图切换事件（修复点击无效）
      const thumbElements = document.querySelectorAll('#thumbList .thumb');
      thumbElements.forEach(thumb => {
        thumb.addEventListener('click', function() {
          const index = parseInt(this.dataset.index, 10);
          if (images[index]) {
            document.getElementById('mainImg').src = images[index];
            thumbElements.forEach(t => t.classList.remove('active'));
            this.classList.add('active');
          }
        });
      });

      document.getElementById('buyBtn').addEventListener('click', () => alert('请联系客服微信：csy212886226 完成购买'));

      // 出价逻辑
      const bidInput = document.getElementById('bidInput');
      const submitBtn = document.getElementById('submitBidBtn');
      const errorEl = document.getElementById('bidError');
      const currentBidSpan = document.getElementById('currentBid');

      submitBtn.addEventListener('click', async () => {
        if (!currentUser) {
          errorEl.textContent = '请先登录后才能出价';
          errorEl.style.display = 'block';
          return;
        }
        const bidValue = parseFloat(bidInput.value);
        if (isNaN(bidValue) || bidValue <= 0) {
          errorEl.textContent = '请输入有效的出价金额';
          errorEl.style.display = 'block';
          return;
        }
        if (bidValue <= currentBid) {
          errorEl.textContent = '出价必须高于当前最高出价';
          errorEl.style.display = 'block';
          return;
        }
        if (bidValue > p.price) {
          errorEl.textContent = `出价不能超过商品标价 ¥${p.price}`;
          errorEl.style.display = 'block';
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = '提交中...';
        errorEl.style.display = 'none';

        try {
          const patchUrl = `https://api.airtable.com/v0/${AIRTABLE_CONFIG.baseId}/${encodeURIComponent(TABLE_PRODUCTS)}/${p.recordId}`;
          const res = await fetch(patchUrl, {
            method: 'PATCH',
            headers: {
              'Authorization': `Bearer ${AIRTABLE_CONFIG.token}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ fields: { '最高出价': bidValue } })
          });
          if (!res.ok) throw new Error('出价失败');
          p.highestBid = bidValue;
          currentBidSpan.textContent = `¥${bidValue}`;
          bidInput.value = '';
          alert('出价成功！');
        } catch (err) {
          console.error(err);
          errorEl.textContent = '出价失败，请稍后重试';
          errorEl.style.display = 'block';
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = '我要出价';
        }
      });
    }

    function navigateToHome() {
      currentRoute='home'; currentProductId=null;
      homePage.classList.add('active'); detailPage.classList.remove('active');
      window.location.hash='#/';
      renderHome(searchInput.value);
    }
    function navigateToDetail(pid) {
      currentRoute='detail'; currentProductId=pid;
      homePage.classList.remove('active'); detailPage.classList.add('active');
      window.location.hash=`#/detail/${pid}`;
      renderDetail(pid);
      window.scrollTo({ top:0, behavior:'smooth' });
    }
    searchInput.addEventListener('input', e => { if (currentRoute==='home') renderHome(e.target.value); });
    backBtn.addEventListener('click', navigateToHome);

    function handleHashChange() {
      const m = window.location.hash.match(/^#\/detail\/(.+)/);
      if (m) {
        const pid=m[1];
        if (products.some(p => p.id===pid)) {
          if (currentRoute!=='detail'||currentProductId!==pid) {
            homePage.classList.remove('active'); detailPage.classList.add('active');
            renderDetail(pid);
            currentRoute='detail'; currentProductId=pid;
          }
        } else navigateToHome();
      } else {
        if (currentRoute!=='home') {
          homePage.classList.add('active'); detailPage.classList.remove('active');
          renderHome(searchInput.value);
          currentRoute='home'; currentProductId=null;
        }
      }
    }
    window.addEventListener('hashchange', handleHashChange);

    // ================= 樱花飘落效果 =================
    function createSakura() {
      const container = document.getElementById('sakuraBg');
      const count = 15;
      for (let i = 0; i < count; i++) {
        const sakura = document.createElement('div');
        sakura.classList.add('sakura');
        sakura.style.left = Math.random() * 100 + '%';
        sakura.style.animationDuration = Math.random() * 5 + 8 + 's';
        sakura.style.animationDelay = Math.random() * 5 + 's';
        sakura.style.fontSize = Math.random() * 16 + 12 + 'px';
        sakura.style.opacity = Math.random() * 0.3 + 0.2;
        sakura.textContent = '🌸';
        container.appendChild(sakura);
      }
    }

    // 启动
    updateUIBasedOnUser();
    loadProducts();
    createSakura();
  </script>
</body>
</html>
