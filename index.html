    // ===== 商品加载（从静态 JSON 读取）=====
    async function loadProducts() {
      try {
        const res = await fetch('products.json?t=' + Date.now()); // 加时间戳防止缓存
        if (!res.ok) throw new Error('网络请求失败');
        products = await res.json();

    // ===== 渲染函数（使用 loading=lazy 和错误占位）=====
    function renderHome(filterText = '') {
      const kw = filterText.trim().toLowerCase();
      const filtered = products.filter(p => !kw || p.id.toLowerCase().includes(kw) || p.title.toLowerCase().includes(kw) || p.desc.toLowerCase().includes(kw) || (p.server||'').toLowerCase().includes(kw));
      document.getElementById('totalCount').textContent = filtered.length;
      if (!filtered.length) {
        document.getElementById('productGrid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#6b7280;">没有找到匹配的账号</div>';
        return;
      }
      document.getElementById('productGrid').innerHTML = filtered.map(p => {
        const displayId = (p.id || '00').toString().padStart(2, '0');
        const isSold = p.status === '已出售';
        return `
          <div class="product-card ${isSold ? 'sold' : ''}" data-product-id="${p.id}">
            ${isSold ? '<div class="sold-overlay">已出售</div>' : ''}
            <div class="card-img">
              <img src="${p.images[0]}" alt="${displayId}" loading="lazy" onerror="this.src='https://placehold.co/700x420/1a1f2b/f0c060?text=加载失败';">
            </div>
            <div class="card-body">
              <div class="product-id">📌 ${displayId}</div>
              <div class="product-title">${truncate(p.title)}</div>
              <div class="product-desc">${truncate(p.desc)}</div>
              <div class="product-server">🌐 ${p.server}</div>
              <div class="product-footer"><span class="price">¥${p.price}</span><button class="btn-sm">查看详情</button></div>
            </div>
          </div>
        `;
      }).join('');
      document.querySelectorAll('.product-card').forEach(c => c.addEventListener('click', () => navigateToDetail(c.dataset.productId)));
    }

    function renderDetail(pid) {
      const p = products.find(x => x.id === pid);
      if (!p) { navigateToHome(); return; }
      currentProductId = pid;
      const images = p.images || [];
      const mainImg = images[0] || 'https://placehold.co/700x420/1a1f2b/f0c060?text=暂无图片';
      const thumbs = images.map((img,i) => `<img src="${img}" class="thumb ${i===0?'active':''}" data-index="${i}" alt="缩略图" loading="lazy" onerror="this.src='https://placehold.co/70x50/1a1f2b/f0c060?text=×';">`).join('');
      const currentBid = p.highestBid || 0;
      const bidDisplay = currentBid > 0 ? `¥${currentBid}` : '暂无出价';
      const displayId = (p.id || '').toString().padStart(2, '0');

      document.getElementById('detailContent').innerHTML = `
