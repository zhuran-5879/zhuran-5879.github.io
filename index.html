    async function sha256(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

    function compressImage(file, maxWidth = 600, quality = 0.7) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            if (img.width <= maxWidth) { resolve(e.target.result); return; }
            const canvas = document.createElement('canvas');
            const ratio = maxWidth / img.width;
            canvas.width = maxWidth;
            canvas.height = img.height * ratio;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', quality));

      const res = await fetch(url, { headers: { 'Authorization': `Bearer ${AIRTABLE_CONFIG.token}` } });
      if (!res.ok) return null;
      const data = await res.json();
      return data.records.length > 0 ? data.records[0] : null;
    }

    async function updateUIBasedOnUser() {
      if (!loginBtn || !userName || !logoutBtn || !userAvatar) return;
      if (currentUser) {
        loginBtn.style.display = 'none';
        userName.style.display = 'inline';
        userAvatar.style.display = 'inline';
        logoutBtn.style.display = 'inline';
        const record = await findUser(currentUser);
        if (record) {
          currentUserRecord = record;
          const nick = record.fields['昵称'] || currentUser;
          userName.textContent = nick;
          const avatarBase64 = record.fields['头像base64'] || '';
          userAvatar.src = avatarBase64 || DEFAULT_AVATAR;
        }
        userAvatar.onclick = openProfileModal;
        userName.onclick = openProfileModal;
      } else {
        loginBtn.style.display = 'inline';
        userName.style.display = 'none';
        userAvatar.style.display = 'none';
        logoutBtn.style.display = 'none';
      }
    }

    function resetAuthModal(mode) {
      authError.style.display = 'none'; authMode = mode;
      authPassword.style.display = 'none'; authConfirmPassword.style.display = 'none';
      authQuestion.style.display = 'none'; authAnswer.style.display = 'none';
      forgotQuestionDisplay.style.display = 'none'; authAccount.style.display = 'block';
      forgotPwd.style.display = 'none';

      if (mode === 'login') {
        modalTitle.textContent = '登录'; authPassword.style.display = 'block';
        authSubmitBtn.textContent = '登录'; toggleMode.textContent = '还没有账号？去注册';
        forgotPwd.style.display = 'block';
      } else if (mode === 'register') {
        modalTitle.textContent = '注册'; authPassword.style.display = 'block';
        authConfirmPassword.style.display = 'block'; authQuestion.style.display = 'block';
        authAnswer.style.display = 'block'; authSubmitBtn.textContent = '注册';
        toggleMode.textContent = '已有账号？去登录';
      } else if (mode === 'forgot') {
        modalTitle.textContent = '找回密码'; authSubmitBtn.textContent = '下一步';
        toggleMode.textContent = '返回登录';
      }
      authAccount.value = ''; authPassword.value = ''; authConfirmPassword.value = '';
      authQuestion.value = ''; authAnswer.value = ''; forgotQuestionDisplay.textContent = '';
    }

    loginBtn.addEventListener('click', () => { resetAuthModal('login'); authModal.classList.add('active'); });
    closeAuthModal.addEventListener('click', () => { authModal.classList.remove('active'); });
    toggleMode.addEventListener('click', () => {
      if (authMode === 'login') resetAuthModal('register');
      else if (authMode === 'register') resetAuthModal('login');
      else if (authMode === 'forgot') resetAuthModal('login');
    });
    forgotPwd.addEventListener('click', () => { resetAuthModal('forgot'); });

    authSubmitBtn.addEventListener('click', async () => {
      authError.style.display = 'none';
      const account = authAccount.value.trim();
      if (!account || account.length < 8 || account.length > 16) {
        authError.textContent = '账号必须为8-16位'; authError.style.display = 'block'; return;
      }
      if (authMode === 'login') {
        const password = authPassword.value;
        if (!password) { authError.textContent = '请输入密码'; authError.style.display = 'block'; return; }
        if (!/[a-zA-Z]/.test(password) || !/[0-9]/.test(password)) {
          authError.textContent = '密码必须包含英文和数字'; authError.style.display = 'block'; return;
        }
        const record = await findUser(account);
        if (!record) { authError.textContent = '账号不存在'; authError.style.display = 'block'; return; }
        if (record.fields['密码'] !== await hashPassword(password)) {
          authError.textContent = '密码错误'; authError.style.display = 'block'; return;
        }
        currentUser = account; authModal.classList.remove('active'); await updateUIBasedOnUser();
      } else if (authMode === 'register') {
        const password = authPassword.value, confirmPassword = authConfirmPassword.value;
        if (!password || password.length < 6) { authError.textContent = '密码至少6位'; authError.style.display = 'block'; return; }
        if (!/[a-zA-Z]/.test(password) || !/[0-9]/.test(password)) {
          authError.textContent = '密码必须包含英文和数字'; authError.style.display = 'block'; return;
        }
        if (password !== confirmPassword) { authError.textContent = '两次密码不一致'; authError.style.display = 'block'; return; }
        const question = authQuestion.value, answer = authAnswer.value.trim();
        if (!question || !answer) { authError.textContent = '请选择密保问题并填写答案'; authError.style.display = 'block'; return; }
        if (await findUser(account)) { authError.textContent = '账号已被注册'; authError.style.display = 'block'; return; }
        const body = { records: [{ fields: { '用户名': account, '密码': await hashPassword(password), '密保问题': question, '密保答案': await hashAnswer(answer), '昵称': account, '头像base64': '' } }] };
        const res = await fetch(API_URL_USERS, { method: 'POST', headers: { 'Authorization': `Bearer ${AIRTABLE_CONFIG.token}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        if (!res.ok) { authError.textContent = '注册失败'; authError.style.display = 'block'; return; }
        currentUser = account; authModal.classList.remove('active'); await updateUIBasedOnUser();
      } else if (authMode === 'forgot') {
        if (!forgotUsername) {
          const record = await findUser(account);
          if (!record) { authError.textContent = '账号不存在'; authError.style.display = 'block'; return; }
          forgotUsername = account;
          authAccount.style.display = 'none'; authSubmitBtn.textContent = '验证答案';
          forgotQuestionDisplay.style.display = 'block';
          forgotQuestionDisplay.textContent = '密保问题：' + record.fields['密保问题'];
          authAnswer.style.display = 'block';
        } else {
          const answer = authAnswer.value.trim();
          if (!answer) { authError.textContent = '请输入密保答案'; authError.style.display = 'block'; return; }
          const record = await findUser(forgotUsername);
          if (!record) { authError.textContent = '账号异常'; authError.style.display = 'block'; return; }
          if (record.fields['密保答案'] !== await hashAnswer(answer)) {
            authError.textContent = '密保答案错误'; authError.style.display = 'block'; return;
          }
          authPassword.style.display = 'block'; authConfirmPassword.style.display = 'block';
          authAnswer.style.display = 'none'; authSubmitBtn.textContent = '重置密码';
          modalTitle.textContent = '重置密码'; authMode = 'resetPassword';
        }
      } else if (authMode === 'resetPassword') {
        const newPassword = authPassword.value, confirmNewPassword = authConfirmPassword.value;
        if (!newPassword || !/[a-zA-Z]/.test(newPassword) || !/[0-9]/.test(newPassword)) {
          authError.textContent = '密码必须包含英文和数字'; authError.style.display = 'block'; return;
        }
        if (newPassword !== confirmNewPassword) { authError.textContent = '两次密码不一致'; authError.style.display = 'block'; return; }
        const record = await findUser(forgotUsername);
        if (!record) { authError.textContent = '用户不存在'; authError.style.display = 'block'; return; }
        const updateUrl = `https://api.airtable.com/v0/${AIRTABLE_CONFIG.baseId}/${encodeURIComponent(TABLE_USERS)}/${record.id}`;
        const res = await fetch(updateUrl, { method: 'PATCH', headers: { 'Authorization': `Bearer ${AIRTABLE_CONFIG.token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ fields: { '密码': await hashPassword(newPassword) } }) });
        if (!res.ok) { authError.textContent = '重置失败'; authError.style.display = 'block'; return; }
        alert('密码重置成功，请重新登录');
        authModal.classList.remove('active'); forgotUsername = ''; currentUser = null; await updateUIBasedOnUser();
      }
    });

    logoutBtn.addEventListener('click', () => {
      currentUser = null; currentUserRecord = null;
      updateUIBasedOnUser();
    });

    // ===== 个人资料 & 我的商品（保持不变）=====
    const profileModal = document.getElementById('profileModal');
    const closeProfileModal = document.getElementById('closeProfileModal');
    const profileAvatarPreview = document.getElementById('profileAvatarPreview');
    const profileNickname = document.getElementById('profileNickname');
    const saveProfileBtn = document.getElementById('saveProfileBtn');
    const uploadAvatarBtn = document.getElementById('uploadAvatarBtn');
    const avatarFileInput = document.getElementById('avatarFileInput');
    const profileError = document.getElementById('profileError');
    const myProductsList = document.getElementById('myProductsList');

    let tempAvatarFile = null;

    async function loadMyProducts() {
      if (!currentUser) return;
      const formula = encodeURIComponent(`{上传者}="${currentUser}"`);
      const url = `${API_URL_PRODUCTS}?filterByFormula=${formula}`;
      try {
        const res = await fetch(url, { headers: { 'Authorization': `Bearer ${AIRTABLE_CONFIG.token}` } });
        const data = await res.json();
        const myProds = data.records;
        if (!myProds.length) {
          myProductsList.innerHTML = '<div style="color:#6b7280; text-align:center; padding:10px;">暂无上传的商品</div>';

        myProductsList.innerHTML = myProds.map(rec => {

              <div class="item-info">

                <span style="margin-left:8px; color:${f['状态']==='已出售'?'#f87171':'#6b7280'}">[${f['状态']||'未出售'}]</span>

              <div class="item-actions">

              </div>
            </div>
          `;
        }).join('');

        myProductsList.innerHTML = '<div style="color:#f87171;">加载失败</div>';
      }
    }

    window.changeProductStatus = async function(recordId, newStatus) {
      if (!currentUser) return;
      if (newStatus === '已出售') {
        alert('请联系客服微信：csy212886226，有买家入手会提醒你');
      }
      try {
        const updateUrl = `https://api.airtable.com/v0/${AIRTABLE_CONFIG.baseId}/${encodeURIComponent(TABLE_PRODUCTS)}/${recordId}`;
        await fetch(updateUrl, {
          method: 'PATCH',
          headers: { 'Authorization': `Bearer ${AIRTABLE_CONFIG.token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ fields: { '状态': newStatus } })
        });
        await loadMyProducts();
        await loadProducts();
      } catch (err) {
        alert('状态更新失败，请重试');
      }
    };

    function openProfileModal() {
      if (!currentUserRecord) return;
      profileNickname.value = currentUserRecord.fields['昵称'] || '';
      profileAvatarPreview.src = currentUserRecord.fields['头像base64'] || DEFAULT_AVATAR;
      tempAvatarFile = null;
      profileError.style.display = 'none';
      loadMyProducts();
      profileModal.classList.add('active');
    }

    closeProfileModal.addEventListener('click', () => profileModal.classList.remove('active'));
    uploadAvatarBtn.addEventListener('click', () => avatarFileInput.click());

    avatarFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        tempAvatarFile = file;
        const reader = new FileReader();
        reader.onload = (ev) => { profileAvatarPreview.src = ev.target.result; };
        reader.readAsDataURL(file);
      }
    });

    saveProfileBtn.addEventListener('click', async () => {
      if (!currentUserRecord) { profileError.textContent = '用户数据未加载'; profileError.style.display = 'block'; return; }
      profileError.style.display = 'none';
      const nickname = profileNickname.value.trim() || currentUser;
      const fields = { '昵称': nickname };
      if (tempAvatarFile) {
        try {
          const compressed = await compressImage(tempAvatarFile, 200, 0.6); // 头像可以小点
          fields['头像base64'] = compressed;
          profileAvatarPreview.src = compressed;
        } catch (err) {
          profileError.textContent = '图片压缩失败'; profileError.style.display = 'block'; return;
        }
      }
      const updateUrl = `https://api.airtable.com/v0/${AIRTABLE_CONFIG.baseId}/${encodeURIComponent(TABLE_USERS)}/${currentUserRecord.id}`;
      try {
        const res = await fetch(updateUrl, { method: 'PATCH', headers: { 'Authorization': `Bearer ${AIRTABLE_CONFIG.token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ fields }) });
        if (!res.ok) throw new Error(await res.text());
        currentUserRecord.fields['昵称'] = nickname;
        if (fields['头像base64']) currentUserRecord.fields['头像base64'] = fields['头像base64'];
        await updateUIBasedOnUser();
        profileModal.classList.remove('active');
        tempAvatarFile = null;
      } catch (err) {
        profileError.textContent = '保存失败：' + err.message; profileError.style.display = 'block';
      }
    });

    // ===== 卖账号上传（提升清晰度并增加大小检查）=====
    const sellBtn = document.getElementById('sellBtn');
    const sellModal = document.getElementById('sellModal');
    const closeSellModal = document.getElementById('closeSellModal');
    const submitSellBtn = document.getElementById('submitSellBtn');
    const sellError = document.getElementById('sellError');
    const sellId = document.getElementById('sellId');
    const sellTitle = document.getElementById('sellTitle');
    const sellDesc = document.getElementById('sellDesc');
    const sellPrice = document.getElementById('sellPrice');
    const sellServer = document.getElementById('sellServer');
    const sellMainImg = document.getElementById('sellMainImg');
    const sellOtherImgs = document.getElementById('sellOtherImgs');
    const mainImgPreview = document.getElementById('mainImgPreview');
    const otherImgsPreview = document.getElementById('otherImgsPreview');

    sellBtn.addEventListener('click', () => {
      if (!currentUser) {
        alert('请先登录后再上传账号');
        resetAuthModal('login');
        authModal.classList.add('active');
        return;
      }
      sellId.value = ''; sellTitle.value = ''; sellDesc.value = '';
      sellPrice.value = ''; sellServer.value = '';
      sellMainImg.value = ''; sellOtherImgs.value = '';
      mainImgPreview.innerHTML = ''; otherImgsPreview.innerHTML = '';
      sellError.style.display = 'none';
      sellModal.classList.add('active');
    });
    closeSellModal.addEventListener('click', () => sellModal.classList.remove('active'));

    sellMainImg.addEventListener('change', (e) => {
      mainImgPreview.innerHTML = '';
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => { mainImgPreview.innerHTML = `<img src="${ev.target.result}" alt="主图">`; };
        reader.readAsDataURL(file);
      }
    });

    sellOtherImgs.addEventListener('change', (e) => {
      otherImgsPreview.innerHTML = '';
      Array.from(e.target.files).slice(0, 20).forEach(file => {
        const reader = new FileReader();
        reader.onload = (ev) => { otherImgsPreview.innerHTML += `<img src="${ev.target.result}">`; };
        reader.readAsDataURL(file);
      });
    });

    submitSellBtn.addEventListener('click', async () => {
      if (!currentUser) { sellError.textContent = '请先登录'; sellError.style.display = 'block'; return; }
      const id = sellId.value.trim();
      const title = sellTitle.value.trim();
      const desc = sellDesc.value.trim();
      const price = parseFloat(sellPrice.value);
      const server = sellServer.value.trim();
      const mainFile = sellMainImg.files[0];
      if (!id || !title || !desc || isNaN(price) || !server || !mainFile) {
        sellError.textContent = '请填写所有必填项并上传主图';
        sellError.style.display = 'block'; return;
      }
      sellError.style.display = 'none';
      submitSellBtn.disabled = true; submitSellBtn.textContent = '提交中...';

      try {
        // 主图：宽度1200，质量0.8
        const mainBase64 = await compressImage(mainFile, 1200, 0.8);
        // 其他图片：宽度600，质量0.7，最多20张
        const otherFiles = sellOtherImgs.files;
        const otherBase64Arr = [];
        for (let i = 0; i < Math.min(otherFiles.length, 20); i++) {
          const base64 = await compressImage(otherFiles[i], 600, 0.7);
          otherBase64Arr.push(base64);
        }
        const otherBase64 = otherBase64Arr.join(',');

        // 检查总大小（主图base64 + 其他base64 总量不宜超过90000字符，约90KB）
        const totalLength = mainBase64.length + otherBase64.length;
        if (totalLength > 90000) {
          sellError.textContent = `图片总大小过大（${(totalLength/1024).toFixed(1)}KB），请减少其他图片数量或降低图片质量`;
          sellError.style.display = 'block';
          submitSellBtn.disabled = false;
          submitSellBtn.textContent = '提交';
          return;
        }

        const fields = {
          '编号': id,
          '标题': title,
          '描述': desc,
          '价格': price,
          '区服': server,
          '上传者': currentUser,
          '最高出价': 0,
          '主图base64': mainBase64,
          '其他图片base64': otherBase64,
          '状态': '未出售'
        };
        const body = { records: [{ fields }] };
        const res = await fetch(API_URL_PRODUCTS, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${AIRTABLE_CONFIG.token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error(await res.text());
        alert('上传成功！');
        sellModal.classList.remove('active');
        await loadProducts();
      } catch (err) {
        console.error(err);
        sellError.textContent = '上传失败：' + err.message;
        sellError.style.display = 'block';
      } finally {
        submitSellBtn.disabled = false;
        submitSellBtn.textContent = '提交';
      }
    });

    // ===== 商品加载与渲染（清晰度提升后已自动使用）=====
    async function loadProducts() {
      try {
        const res = await fetch(API_URL_PRODUCTS, { headers: { 'Authorization': `Bearer ${AIRTABLE_CONFIG.token}` } });
        if (!res.ok) throw new Error('网络请求失败');
        const data = await res.json();
        products = data.records.map(record => {
          const f = record.fields;
          let mainImg = f['主图base64'] || (f['主图'] && f['主图'][0] ? f['主图'][0].url : 'https://placehold.co/700x420/1a1f2b/f0c060?text=暂无图片');
          let otherImgs = [];
          if (f['其他图片base64']) {
            otherImgs = f['其他图片base64'].split(',').filter(Boolean);
          } else if (f['其他图片']) {
            otherImgs = f['其他图片'].map(img => img.url);
          }
          return {
            id: f['编号'] || '无编号',
            recordId: record.id,
            title: f['标题'] || '无标题',
            desc: f['描述'] || '',
            price: f['价格'] || 0,
            server: f['区服'] || '未知区服',
            highestBid: f['最高出价'] || 0,
            status: f['状态'] || '未出售',
            images: [mainImg, ...otherImgs]
          };
        });
        renderHome();
        if (window.location.hash) handleHashChange();
        else window.location.hash = '#/';
      } catch (err) {
        console.error(err);
        document.getElementById('productGrid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#6b7280;">数据加载失败，请稍后重试</div>';
      }
    }

    const homePage = document.getElementById('homePage');
    const detailPage = document.getElementById('detailPage');
    const productGrid = document.getElementById('productGrid');
    const totalCountSpan = document.getElementById('totalCount');
    const searchInput = document.getElementById('searchInput');
    const detailContent = document.getElementById('detailContent');
    const backBtn = document.getElementById('backBtn');

    function truncate(str, len=30) { return str && str.length > len ? str.slice(0,len)+'...' : str||''; }
    let currentRoute = 'home', currentProductId = null;

    function renderHome(filterText='') {
      const kw = filterText.trim().toLowerCase();
      const filtered = products.filter(p => !kw || p.id.toLowerCase().includes(kw) || p.title.toLowerCase().includes(kw) || p.desc.toLowerCase().includes(kw) || (p.server||'').toLowerCase().includes(kw));
      totalCountSpan.textContent = filtered.length;
      if (!filtered.length) { productGrid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#6b7280;">没有找到匹配的账号</div>'; return; }
      productGrid.innerHTML = filtered.map(p => {
        const displayId = p.id.toString().padStart(2, '0');
        const isSold = p.status === '已出售';
        return `
          <div class="product-card ${isSold ? 'sold' : ''}" data-product-id="${p.id}">
            ${isSold ? '<div class="sold-overlay">已出售</div>' : ''}
            <div class="card-img"><img src="${p.images[0]}" alt="${displayId}"></div>
            <div class="card-body">
              <div class="product-id">📌 ${displayId}</div>
              <div class="product-title">${truncate(p.title)}</div>
              <div class="product-desc">${truncate(p.desc)}</div>
              <div class="product-server">🌐 ${p.server}</div>
              <div class="product-footer"><span class="price">¥${p.price}</span><button class="btn-sm">查看详情</button></div>
            </div>
          </div>
        `;
      }).join('');
      document.querySelectorAll('.product-card').forEach(c => c.addEventListener('click', () => navigateToDetail(c.dataset.productId)));
    }

    function renderDetail(pid) {
      const p = products.find(x => x.id === pid);
      if (!p) { navigateToHome(); return; }
      currentProductId = pid;
      const images = p.images || [];
      const mainImg = images[0] || 'https://placehold.co/700x420/1a1f2b/f0c060?text=暂无图片';
      const thumbs = images.map((img,i) => `<img src="${img}" class="thumb ${i===0?'active':''}" data-index="${i}" alt="缩略图">`).join('');
      const currentBid = p.highestBid || 0;
      const bidDisplay = currentBid > 0 ? `¥${currentBid}` : '暂无出价';
      const displayId = p.id.toString().padStart(2, '0');

      detailContent.innerHTML = `
        <div class="detail-gallery">
          <img src="${mainImg}" class="main-img" id="mainImg" alt="${displayId}">
          <div class="thumb-list" id="thumbList">${thumbs}</div>
        </div>
        <div class="detail-info">
          <h1>${truncate(p.title)}</h1>
          <div class="detail-price">¥${p.price}</div>
          <div class="bid-section">
            <div class="bid-current">当前最高出价：<span id="currentBid">${bidDisplay}</span></div>
            <div class="bid-form">
              <input type="number" id="bidInput" placeholder="输入你的出价" min="1" step="0.01">
              <button id="submitBidBtn">我要出价</button>
            </div>
            <div class="bid-error" id="bidError"></div>
          </div>
          <div class="detail-desc">${p.desc}</div>
          <div class="detail-meta">
            <div class="meta-item"><div class="label">商品编号</div><div class="value">${displayId}</div></div>
            <div class="meta-item"><div class="label">所在区服</div><div class="value">${p.server}</div></div>
          </div>
          <button class="buy-btn" id="buyBtn">💬 联系客服购买</button>
          <div class="contact-row"><span>📱 客服微信：csy212886226</span></div>
        </div>
      `;

      const thumbElements = document.querySelectorAll('#thumbList .thumb');
      thumbElements.forEach(thumb => {
        thumb.addEventListener('click', function() {
          const index = parseInt(this.dataset.index, 10);
          if (images[index]) {
            document.getElementById('mainImg').src = images[index];
            thumbElements.forEach(t => t.classList.remove('active'));
            this.classList.add('active');
          }
        });
      });

      document.getElementById('mainImg').addEventListener('click', () => {
        document.getElementById('lightboxImg').src = document.getElementById('mainImg').src;
        document.getElementById('lightbox').classList.add('active');
      });
      document.getElementById('lightbox').addEventListener('click', () => {
        document.getElementById('lightbox').classList.remove('active');
      });

      document.getElementById('buyBtn').addEventListener('click', () => alert('请联系客服微信：csy212886226 完成购买'));

      const bidInput = document.getElementById('bidInput');
      const submitBtn = document.getElementById('submitBidBtn');
      const errorEl = document.getElementById('bidError');
      const currentBidSpan = document.getElementById('currentBid');

      submitBtn.addEventListener('click', async () => {
        if (!currentUser) { errorEl.textContent = '请先登录后才能出价'; errorEl.style.display = 'block'; return; }
        const bidValue = parseFloat(bidInput.value);
        if (isNaN(bidValue) || bidValue <= 0) { errorEl.textContent = '请输入有效的出价金额'; errorEl.style.display = 'block'; return; }
        if (bidValue <= currentBid) { errorEl.textContent = '出价必须高于当前最高出价'; errorEl.style.display = 'block'; return; }
        if (bidValue > p.price) { errorEl.textContent = `出价不能超过商品标价 ¥${p.price}`; errorEl.style.display = 'block'; return; }
        submitBtn.disabled = true; submitBtn.textContent = '提交中...'; errorEl.style.display = 'none';
        try {
          const patchUrl = `https://api.airtable.com/v0/${AIRTABLE_CONFIG.baseId}/${encodeURIComponent(TABLE_PRODUCTS)}/${p.recordId}`;
          const res = await fetch(patchUrl, {
            method: 'PATCH',
            headers: { 'Authorization': `Bearer ${AIRTABLE_CONFIG.token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ fields: { '最高出价': bidValue } })
          });
          if (!res.ok) throw new Error('出价失败');
          p.highestBid = bidValue;
          currentBidSpan.textContent = `¥${bidValue}`;
          bidInput.value = '';
          alert('出价成功！');
        } catch (err) {
          errorEl.textContent = '出价失败，请稍后重试'; errorEl.style.display = 'block';
        } finally {
          submitBtn.disabled = false; submitBtn.textContent = '我要出价';
        }
      });
    }

    function navigateToHome() { currentRoute='home'; currentProductId=null; homePage.classList.add('active'); detailPage.classList.remove('active'); window.location.hash='#/'; renderHome(searchInput.value); }
    function navigateToDetail(pid) { currentRoute='detail'; currentProductId=pid; homePage.classList.remove('active'); detailPage.classList.add('active'); window.location.hash=`#/detail/${pid}`; renderDetail(pid); window.scrollTo({ top:0, behavior:'smooth' }); }
    searchInput.addEventListener('input', e => { if (currentRoute==='home') renderHome(e.target.value); });
    backBtn.addEventListener('click', navigateToHome);

    function handleHashChange() {
      const m = window.location.hash.match(/^#\/detail\/(.+)/);
      if (m) {
        const pid=m[1];
        if (products.some(p => p.id===pid)) {
          if (currentRoute!=='detail'||currentProductId!==pid) {
            homePage.classList.remove('active'); detailPage.classList.add('active');
            renderDetail(pid);
            currentRoute='detail'; currentProductId=pid;
          }
        } else navigateToHome();
      } else {
        if (currentRoute!=='home') {
          homePage.classList.add('active'); detailPage.classList.remove('active');
          renderHome(searchInput.value);
          currentRoute='home'; currentProductId=null;
        }
      }
    }
    window.addEventListener('hashchange', handleHashChange);

    function createSakura() {
      const container = document.getElementById('sakuraBg');
      for (let i = 0; i < 15; i++) {
        const sakura = document.createElement('div');
        sakura.classList.add('sakura');
        sakura.style.left = Math.random() * 100 + '%';
        sakura.style.animationDuration = Math.random() * 5 + 8 + 's';
        sakura.style.animationDelay = Math.random() * 5 + 's';
        sakura.style.fontSize = Math.random() * 16 + 12 + 'px';
        sakura.style.opacity = Math.random() * 0.3 + 0.2;
        sakura.textContent = '🌸';
        container.appendChild(sakura);
      }
    }

    updateUIBasedOnUser();
    loadProducts();
    createSakura();
  </script>
</body>
</html>
