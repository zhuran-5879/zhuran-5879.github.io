  <!-- 弹窗组件与之前相同，此处省略以节省篇幅，实际使用中请保留之前完整的弹窗结构 -->

  <script>
    // ================= 配置 ==================
    const AIRTABLE_CONFIG = {
      baseId: 'appHghJgUFfWnqFaU',
      token: 'patM1jbcaFgZQVDru.a3b8d16f90f9e5dee9f6a5516a48e0b33563e2adf8f3bfe6d9b421505c68772f',   // ⚠️ 替换
    };
    const TABLE_PRODUCTS = 'products';
    const TABLE_USERS = 'users';
    const API_URL_PRODUCTS = `https://api.airtable.com/v0/${AIRTABLE_CONFIG.baseId}/${encodeURIComponent(TABLE_PRODUCTS)}`;
    const API_URL_USERS = `https://api.airtable.com/v0/${AIRTABLE_CONFIG.baseId}/${encodeURIComponent(TABLE_USERS)}`;

    const SALT = 'zhuran_2026_salt';
    const DEFAULT_AVATAR = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23212833'/%3E%3Ctext x='50' y='65' text-anchor='middle' fill='%23f0c060' font-size='40'%3E👤%3C/text%3E%3C/svg%3E";

    let products = [];

    let currentUserRecord = null;

    // ===== 背景音乐控制 =====
    const bgMusic = document.getElementById('bgMusic');
    const musicToggle = document.getElementById('musicToggle');
    let musicPlaying = false;
    musicToggle.addEventListener('click', () => {

        bgMusic.pause();
        musicToggle.textContent = '🎵';
      } else {
        bgMusic.play().catch(() => {});
        musicToggle.textContent = '🔇';
      }
      musicPlaying = !musicPlaying;

    // 首次交互后尝试播放
    document.addEventListener('click', () => {
      if (!musicPlaying) {
        bgMusic.play().catch(() => {});
        musicPlaying = true;
        musicToggle.textContent = '🔇';
      }
    }, { once: true });

    // ================= 工具函数 =================
    async function sha256(message) { /* 保持原样 */ }
    async function hashPassword(password) { return await sha256(password + SALT); }
    async function hashAnswer(answer) { return await sha256(answer.toLowerCase() + SALT); }

    function compressImage(file, maxWidth = 200, quality = 0.6) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            if (img.width <= maxWidth) { resolve(e.target.result); return; }
            const canvas = document.createElement('canvas');
            const ratio = maxWidth / img.width;
            canvas.width = maxWidth;
            canvas.height = img.height * ratio;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // ================= 用户认证（保持之前代码）=================
    // ... 省略，请从上一完整代码中复制 login/register/forgot/reset 等函数
    // 包括 updateUIBasedOnUser, resetAuthModal, authSubmitBtn 等

    // ================= 卖账号上传（支持其他图片）=================
    const sellBtn = document.getElementById('sellBtn');
    const sellModal = document.getElementById('sellModal');
    const closeSellModal = document.getElementById('closeSellModal');
    const submitSellBtn = document.getElementById('submitSellBtn');
    const sellError = document.getElementById('sellError');
    const sellId = document.getElementById('sellId');
    const sellTitle = document.getElementById('sellTitle');
    const sellDesc = document.getElementById('sellDesc');
    const sellPrice = document.getElementById('sellPrice');
    const sellServer = document.getElementById('sellServer');
    const sellMainImg = document.getElementById('sellMainImg');
    const sellOtherImgs = document.getElementById('sellOtherImgs');
    const mainImgPreview = document.getElementById('mainImgPreview');
    const otherImgsPreview = document.getElementById('otherImgsPreview');

    sellBtn.addEventListener('click', () => {
      if (!currentUser) {
        alert('请先登录后再上传账号');
        resetAuthModal('login');
        authModal.classList.add('active');
        return;
      }
      sellId.value = ''; sellTitle.value = ''; sellDesc.value = '';
      sellPrice.value = ''; sellServer.value = '';
      sellMainImg.value = ''; sellOtherImgs.value = '';
      mainImgPreview.innerHTML = ''; otherImgsPreview.innerHTML = '';
      sellError.style.display = 'none';
      sellModal.classList.add('active');
    });
    closeSellModal.addEventListener('click', () => sellModal.classList.remove('active'));

    sellMainImg.addEventListener('change', (e) => {
      mainImgPreview.innerHTML = '';
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => { mainImgPreview.innerHTML = `<img src="${ev.target.result}" alt="主图">`; };
        reader.readAsDataURL(file);
      }
    });

    sellOtherImgs.addEventListener('change', (e) => {
      otherImgsPreview.innerHTML = '';
      Array.from(e.target.files).slice(0, 2).forEach(file => { // 限制最多2张
        const reader = new FileReader();
        reader.onload = (ev) => { otherImgsPreview.innerHTML += `<img src="${ev.target.result}">`; };
        reader.readAsDataURL(file);
      });
    });

    submitSellBtn.addEventListener('click', async () => {
      if (!currentUser) { sellError.textContent = '请先登录'; sellError.style.display = 'block'; return; }
      const id = sellId.value.trim();
      const title = sellTitle.value.trim();
      const desc = sellDesc.value.trim();
      const price = parseFloat(sellPrice.value);
      const server = sellServer.value.trim();
      const mainFile = sellMainImg.files[0];
      if (!id || !title || !desc || isNaN(price) || !server || !mainFile) {
        sellError.textContent = '请填写所有必填项并上传主图';
        sellError.style.display = 'block'; return;
      }
      sellError.style.display = 'none';
      submitSellBtn.disabled = true; submitSellBtn.textContent = '提交中...';

      try {
        // 主图压缩 (宽度400, 质量0.5)
        const mainBase64 = await compressImage(mainFile, 400, 0.5);
        // 其他图片压缩 (宽度150, 质量0.4)，最多2张
        const otherFiles = sellOtherImgs.files;
        const otherBase64Arr = [];
        for (let i = 0; i < Math.min(otherFiles.length, 2); i++) {
          const base64 = await compressImage(otherFiles[i], 150, 0.4);
          otherBase64Arr.push(base64);
        }
        const fields = {
          '编号': id,
          '标题': title,
          '描述': desc,
          '价格': price,
          '区服': server,
          '上传者': currentUser,
          '最高出价': 0,
          '主图base64': mainBase64,
          '其他图片base64': otherBase64Arr.join(','),
          '状态': '未出售'
        };
        const body = { records: [{ fields }] };
        const res = await fetch(API_URL_PRODUCTS, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${AIRTABLE_CONFIG.token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error(await res.text());
        alert('上传成功！');
        sellModal.classList.remove('active');
        await loadProducts();
      } catch (err) {
        console.error(err);
        sellError.textContent = '上传失败：' + err.message;
        sellError.style.display = 'block';
      } finally {
        submitSellBtn.disabled = false;
        submitSellBtn.textContent = '提交';
      }
    });

    // ================= 商品加载（含状态字段）=================
    async function loadProducts() {
      try {
        const res = await fetch(API_URL_PRODUCTS, { headers: { 'Authorization': `Bearer ${AIRTABLE_CONFIG.token}` } });
        if (!res.ok) throw new Error('网络请求失败');
        const data = await res.json();
        products = data.records.map(record => {
          const f = record.fields;
          let mainImg = f['主图base64'] || (f['主图'] && f['主图'][0] ? f['主图'][0].url : 'https://placehold.co/700x420/1a1f2b/f0c060?text=暂无图片');
          let otherImgs = [];
          if (f['其他图片base64']) {
            otherImgs = f['其他图片base64'].split(',').filter(Boolean);
          } else if (f['其他图片']) {
            otherImgs = f['其他图片'].map(img => img.url);
          }
          return {
            id: f['编号'] || '无编号',
            recordId: record.id,
            title: f['标题'] || '无标题',
            desc: f['描述'] || '',
            price: f['价格'] || 0,
            server: f['区服'] || '未知区服',
            highestBid: f['最高出价'] || 0,
            status: f['状态'] || '未出售',
            images: [mainImg, ...otherImgs]
          };
        });
        renderHome();
        if (window.location.hash) handleHashChange();
        else window.location.hash = '#/';
      } catch (err) {
        console.error(err);
        document.getElementById('productGrid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#6b7280;">数据加载失败，请稍后重试</div>';
      }
    }

    // ================= 渲染商品卡片（加入状态样式）=================
    const homePage = document.getElementById('homePage');
    const detailPage = document.getElementById('detailPage');
    const productGrid = document.getElementById('productGrid');
    const totalCountSpan = document.getElementById('totalCount');
    const searchInput = document.getElementById('searchInput');
    const detailContent = document.getElementById('detailContent');
    const backBtn = document.getElementById('backBtn');

    function truncate(str, len=30) { return str && str.length > len ? str.slice(0,len)+'...' : str||''; }
    let currentRoute = 'home', currentProductId = null;

    function renderHome(filterText='') {
      const kw = filterText.trim().toLowerCase();
      const filtered = products.filter(p => !kw || p.id.toLowerCase().includes(kw) || p.title.toLowerCase().includes(kw) || p.desc.toLowerCase().includes(kw) || (p.server||'').toLowerCase().includes(kw));
      totalCountSpan.textContent = filtered.length;
      if (!filtered.length) { productGrid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#6b7280;">没有找到匹配的账号</div>'; return; }
      productGrid.innerHTML = filtered.map(p => {
        const displayId = p.id.toString().padStart(2, '0');
        const isSold = p.status === '已出售';
        return `
          <div class="product-card ${isSold ? 'sold' : ''}" data-product-id="${p.id}">
            ${isSold ? '<div class="sold-overlay">已出售</div>' : ''}
            <div class="card-img"><img src="${p.images[0]}" alt="${displayId}"></div>
            <div class="card-body">
              <div class="product-id">📌 ${displayId}</div>
              <div class="product-title">${truncate(p.title)}</div>
              <div class="product-desc">${truncate(p.desc)}</div>
              <div class="product-server">🌐 ${p.server}</div>
              <div class="product-footer"><span class="price">¥${p.price}</span><button class="btn-sm">查看详情</button></div>
            </div>
          </div>
        `;
      }).join('');
      document.querySelectorAll('.product-card').forEach(c => c.addEventListener('click', () => navigateToDetail(c.dataset.productId)));
    }

    function renderDetail(pid) {
      const p = products.find(x => x.id === pid);
      if (!p) { navigateToHome(); return; }
      currentProductId = pid;
      const images = p.images || [];
      const mainImg = images[0] || 'https://placehold.co/700x420/1a1f2b/f0c060?text=暂无图片';
      const thumbs = images.map((img,i) => `<img src="${img}" class="thumb ${i===0?'active':''}" data-index="${i}" alt="缩略图">`).join('');
      const currentBid = p.highestBid || 0;
      const bidDisplay = currentBid > 0 ? `¥${currentBid}` : '暂无出价';
      const displayId = p.id.toString().padStart(2, '0');

      detailContent.innerHTML = `
        <div class="detail-gallery">
          <img src="${mainImg}" class="main-img" id="mainImg" alt="${displayId}">
          <div class="thumb-list" id="thumbList">${thumbs}</div>
        </div>
        <div class="detail-info">
          <h1>${truncate(p.title)}</h1>
          <div class="detail-price">¥${p.price}</div>
          <div class="bid-section">
            <div class="bid-current">当前最高出价：<span id="currentBid">${bidDisplay}</span></div>
            <div class="bid-form">
              <input type="number" id="bidInput" placeholder="输入你的出价" min="1" step="0.01">
              <button id="submitBidBtn">我要出价</button>
            </div>
            <div class="bid-error" id="bidError"></div>
          </div>
          <div class="detail-desc">${p.desc}</div>
          <div class="detail-meta">
            <div class="meta-item"><div class="label">商品编号</div><div class="value">${displayId}</div></div>
            <div class="meta-item"><div class="label">所在区服</div><div class="value">${p.server}</div></div>
          </div>
          <button class="buy-btn" id="buyBtn">💬 联系客服购买</button>
          <div class="contact-row"><span>📱 客服微信：csy212886226</span></div>
        </div>
      `;

      // 缩略图与放大逻辑保持不变
      // ... （与之前相同）

      // 出价逻辑保持不变
      // ...
    }

    // ================= 我的商品 & 状态切换 =================
    async function loadMyProducts() {
      if (!currentUser) return;
      const formula = encodeURIComponent(`{上传者}="${currentUser}"`);
      const url = `${API_URL_PRODUCTS}?filterByFormula=${formula}`;
      try {
        const res = await fetch(url, { headers: { 'Authorization': `Bearer ${AIRTABLE_CONFIG.token}` } });
        const data = await res.json();
        const myProducts = data.records;
        const listDiv = document.getElementById('myProductsList');
        if (myProducts.length === 0) {
          listDiv.innerHTML = '<div style="color:#6b7280; text-align:center; padding:10px;">暂无上传的商品</div>';
          return;
        }
        listDiv.innerHTML = myProducts.map(rec => {
          const f = rec.fields;
          return `
            <div class="my-product-item">
              <div class="item-info">
                <strong>📌 ${f['编号']}</strong> - ${f['标题']} <span style="color:#9aa0b0;">(¥${f['价格']})</span>
                <span style="margin-left:8px; color:${f['状态']==='已出售'?'#f87171':'#6b7280'}">[${f['状态']||'未出售'}]</span>
              </div>
              <div class="item-actions">
                <button onclick="changeProductStatus('${rec.id}', '已出售')">已出售</button>
                <button onclick="changeProductStatus('${rec.id}', '未出售')">未出售</button>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        document.getElementById('myProductsList').innerHTML = '<div style="color:#f87171;">加载失败</div>';
      }
    }

    window.changeProductStatus = async function(recordId, newStatus) {
      if (!currentUser) return;
      if (newStatus === '已出售') {
        alert('请联系客服微信：csy212886226，有买家入手会提醒你');
      }
      try {
        const updateUrl = `https://api.airtable.com/v0/${AIRTABLE_CONFIG.baseId}/${encodeURIComponent(TABLE_PRODUCTS)}/${recordId}`;
        await fetch(updateUrl, {
          method: 'PATCH',
          headers: { 'Authorization': `Bearer ${AIRTABLE_CONFIG.token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ fields: { '状态': newStatus } })
        });
        await loadMyProducts();
        await loadProducts(); // 刷新主列表
      } catch (err) {
        alert('状态更新失败，请重试');
      }
    };

    // 修改 openProfileModal，调用 loadMyProducts
    function openProfileModal() {
      // ...（之前代码，最后加上 loadMyProducts();）
    }

    // 其余路由、樱花等保持不变
  </script>
