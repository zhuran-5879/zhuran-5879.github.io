<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>竹染游戏账号交易平台</title>
  <!-- 引入 Supabase JS 客户端 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ========== 你的原有样式（完全保留）========== */
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', system-ui, sans-serif; background:#0c0f15; color:#e8edf2; min-height:100vh; }
    .navbar { position:sticky; top:0; z-index:50; background:rgba(18,22,28,0.85); backdrop-filter:blur(12px); border-bottom:1px solid rgba(200,160,80,0.15); padding:0 20px; height:64px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; }
    .logo { font-size:1.6rem; font-weight:800; background:linear-gradient(135deg, #f0c060 0%, #d4942b 80%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; letter-spacing:1px; }
    .search-box { display:flex; align-items:center; background:#1e232b; border:1px solid #2e3540; border-radius:40px; padding:6px 16px; width:280px; max-width:50vw; transition:border 0.2s; }
    .search-box:focus-within { border-color:#d4942b; }
    .search-box input { background:transparent; border:none; outline:none; color:#e8edf2; font-size:0.95rem; width:100%; margin-left:6px; }
    .search-box input::placeholder { color:#6b7280; }
    .page { display:none; padding:24px 20px 40px; max-width:1300px; margin:0 auto; }
    .page.active { display:block; }
    .section-title { font-size:1.5rem; font-weight:700; margin:16px 0 24px; padding-left:8px; border-left:4px solid #d4942b; }
    .game-meta { display:flex; align-items:center; gap:16px; margin-bottom:20px; color:#9aa0b0; }
    .product-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(270px, 1fr)); gap:20px; }
    .product-card { background:#161b22; border:1px solid #252b35; border-radius:20px; overflow:hidden; cursor:pointer; transition:transform 0.2s, border-color 0.2s; display:flex; flex-direction:column; }
    .product-card:hover { transform:translateY(-4px); border-color:#d4942b; }
    .card-img { height:170px; background:#1a1f2b; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    .card-img img { width:100%; height:100%; object-fit:cover; }
    .card-body { padding:14px; flex:1; display:flex; flex-direction:column; }
    .product-id { font-size:0.9rem; color:#f0c060; font-weight:700; margin-bottom:6px; }
    .product-title { font-weight:700; font-size:1.1rem; margin-bottom:8px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
    .product-desc { font-size:0.85rem; color:#9aa0b0; margin-bottom:6px; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
    .product-server { font-size:0.8rem; color:#6b7280; margin-bottom:10px; }
    .product-footer { display:flex; justify-content:space-between; align-items:center; margin-top:auto; }
    .price { font-size:1.35rem; font-weight:800; color:#f87171; }
    .btn-sm { background:#212833; border:none; color:#e8edf2; padding:6px 14px; border-radius:30px; font-size:0.8rem; font-weight:600; cursor:pointer; transition:background 0.2s; }
    .btn-sm:hover { background:#d4942b; }
    .back-btn { background:none; border:1px solid #2e3540; color:#9aa0b0; padding:8px 18px; border-radius:30px; font-weight:600; cursor:pointer; margin-bottom:24px; display:inline-flex; align-items:center; gap:6px; transition:0.2s; }
    .back-btn:hover { border-color:#d4942b; color:#f0c060; }
    .detail-layout { display:flex; flex-wrap:wrap; gap:28px; }
    .detail-gallery { flex:1 1 380px; background:#161b22; border-radius:24px; padding:16px; }
    .main-img { width:100%; border-radius:18px; margin-bottom:12px; aspect-ratio:16/10; object-fit:cover; background:#1e232b; }
    .thumb-list { display:flex; gap:10px; overflow-x:auto; }
    .thumb { width:70px; height:50px; border-radius:10px; object-fit:cover; cursor:pointer; border:2px solid transparent; transition:0.2s; }
    .thumb.active, .thumb:hover { border-color:#d4942b; }
    .detail-info { flex:1 1 300px; }
    .detail-info h1 { font-size:1.8rem; margin-bottom:12px; }
    .detail-price { font-size:2.2rem; font-weight:800; color:#f87171; margin-bottom:20px; }
    .bid-section { background:#1a1f2b; border-radius:16px; padding:20px; margin:20px 0; }
    .bid-current { font-size:1.3rem; font-weight:700; color:#f0c060; margin-bottom:12px; }
    .bid-current span { color:#e8edf2; }
    .bid-form { display:flex; gap:10px; align-items:center; }
    .bid-form input { flex:1; background:#0c0f15; border:1px solid #2e3540; color:#e8edf2; padding:10px 16px; border-radius:30px; font-size:1rem; outline:none; }
    .bid-form input:focus { border-color:#d4942b; }
    .bid-form button { background:linear-gradient(135deg, #d4942b, #b5761e); border:none; color:#0c0f15; font-weight:800; padding:10px 24px; border-radius:30px; cursor:pointer; font-size:1rem; transition:opacity 0.2s; }
    .bid-form button:hover { opacity:0.9; }
    .bid-error { color:#f87171; font-size:0.9rem; margin-top:8px; display:none; }
    .detail-desc { color:#b0b8c5; margin-bottom:24px; line-height:1.7; word-break:break-word; }
    .detail-meta { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:28px; }
    .meta-item { background:#161b22; padding:10px 12px; border-radius:12px; }
    .meta-item .label { font-size:0.75rem; color:#6b7280; }
    .meta-item .value { font-weight:700; }
    .buy-btn { width:100%; background:linear-gradient(135deg, #d4942b, #b5761e); border:none; color:#0c0f15; font-weight:800; font-size:1.2rem; padding:14px; border-radius:40px; cursor:pointer; transition:opacity 0.2s; }
    .buy-btn:hover { opacity:0.9; }
    .contact-row { display:flex; align-items:center; gap:16px; margin-top:16px; color:#9aa0b0; }
    .float-sell-btn { position:fixed; bottom:30px; right:30px; background:linear-gradient(135deg, #d4942b, #b5761e); color:#0c0f15; font-weight:800; font-size:1.1rem; padding:14px 24px; border-radius:50px; box-shadow:0 8px 25px rgba(212,148,43,0.4); cursor:pointer; z-index:1000; border:none; }
    .float-sell-btn:hover { transform:scale(1.05); }
    .footer { text-align:center; padding:32px 20px; color:#5a6270; font-size:0.85rem; border-top:1px solid #1e2530; }
    /* 用户按钮 */
    .user-menu { display:flex; align-items:center; gap:12px; }
    .user-menu button { background:none; border:1px solid #2e3540; color:#e8edf2; padding:6px 16px; border-radius:30px; font-size:0.9rem; cursor:pointer; }
    .user-menu button:hover { background:#d4942b; color:#0c0f15; }
    /* 弹窗 */
    .modal-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.8); z-index:1001; align-items:center; justify-content:center; }
    .modal-overlay.active { display:flex; }
    .modal { background:#161b22; border-radius:24px; padding:32px; width:90%; max-width:420px; position:relative; }
    .modal h2 { margin-bottom:20px; }
    .modal input { width:100%; padding:12px 16px; margin-bottom:16px; background:#0c0f15; border:1px solid #2e3540; color:#e8edf2; border-radius:12px; font-size:1rem; outline:none; }
    .modal input:focus { border-color:#d4942b; }
    .modal button { width:100%; padding:12px; background:linear-gradient(135deg, #d4942b, #b5761e); border:none; color:#0c0f15; font-weight:800; font-size:1rem; border-radius:30px; cursor:pointer; margin-top:8px; }
    .modal .link-text { color:#9aa0b0; text-align:center; margin-top:16px; cursor:pointer; font-size:0.9rem; }
    .modal .close-btn { position:absolute; top:16px; right:20px; background:none; border:none; color:#6b7280; font-size:1.5rem; cursor:pointer; }
    @media (max-width:640px) { /* 省略，保留原有媒体查询 */ }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="logo">⚡ 竹染游戏账号交易平台</div>
    <div class="search-box">
      <span style="font-size:1.1rem;">🔍</span>
      <input type="text" id="searchInput" placeholder="搜索商品编号/信息……" autocomplete="off">
    </div>
    <div class="user-menu" id="userMenu">
      <!-- 未登录时显示登录按钮，已登录显示用户名和退出按钮 -->
      <button id="loginBtn" style="display:none;">登录/注册</button>

      <button id="logoutBtn" style="display:none;">退出</button>
    </div>
  </header>

  <!-- 主页和详情页内容不变 -->
  <div id="homePage" class="page active">
    <div class="section-title">🔥 航海王燃烧意志 · 账号商城</div>
    <div class="game-meta">
      <span>🎮</span> 当前展示 <strong>航海王燃烧意志</strong> 账号 · 共 <span id="totalCount">0</span> 个在售
    </div>
    <div class="product-grid" id="productGrid"></div>
  </div>

  <div id="detailPage" class="page">
    <button class="back-btn" id="backBtn">← 返回商城</button>
    <div class="detail-layout" id="detailContent"></div>
  </div>

  <button class="float-sell-btn" id="sellBtn">💰 卖账号</button>
  <div class="footer">© 2026 竹染游戏账号交易平台 zhuran.cc · 客服微信：csy212886226</div>

  <!-- 登录/注册/找回密码弹窗 -->
  <div class="modal-overlay" id="authModal">
    <div class="modal">
      <button class="close-btn" id="closeModal">✕</button>
      <h2 id="modalTitle">登录</h2>
      <input type="email" id="authEmail" placeholder="邮箱地址" required>
      <input type="password" id="authPassword" placeholder="密码" style="display:block;">
      <input type="password" id="authConfirmPassword" placeholder="确认密码" style="display:none;">
      <button id="authSubmitBtn">登录</button>
      <div class="link-text" id="toggleMode">还没有账号？去注册</div>
      <div class="link-text" id="forgotPwd" style="margin-top:4px;">忘记密码？</div>
      <div id="authError" style="color:#f87171; text-align:center; margin-top:8px; display:none;"></div>
    </div>
  </div>

  <script>
       // ================= Supabase 配置 ==================
    const SUPABASE_URL = 'https://wfqhlgfilrqpqfkuhoua.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_4zSvzBJ_l5lw2sp7s-wiHA_JqszbnTl';
    const { createClient } = supabase;  // 全局 supabase 是 SDK 暴露的
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    // ================= Airtable 配置 ==================
    const AIRTABLE_CONFIG = {
      baseId: 'appHghJgUFfWnqFaU',
      tableName: 'products',
      token: 'patM1jbcaFgZQVDru.a3b8d16f90f9e5dee9f6a5516a48e0b33563e2adf8f3bfe6d9b421505c68772f',  // 替换成你的读写 Token
    };
    const encodedTable = encodeURIComponent(AIRTABLE_CONFIG.tableName);
    const API_URL = `https://api.airtable.com/v0/${AIRTABLE_CONFIG.baseId}/${encodedTable}`;

    let products = [];
    let currentUser = null;

    // ================= 认证相关 =================
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const userName = document.getElementById('userName');
    const authModal = document.getElementById('authModal');
    const closeModal = document.getElementById('closeModal');
    const modalTitle = document.getElementById('modalTitle');
    const authEmail = document.getElementById('authEmail');
    const authPassword = document.getElementById('authPassword');
    const authConfirmPassword = document.getElementById('authConfirmPassword');
    const authSubmitBtn = document.getElementById('authSubmitBtn');
    const toggleMode = document.getElementById('toggleMode');
    const forgotPwd = document.getElementById('forgotPwd');
    const authError = document.getElementById('authError');

    let authMode = 'login';

    async function checkUser() {
      if (!supabaseClient) return;
      const { data: { user } } = await supabaseClient.auth.getUser();
      currentUser = user;
      updateUIBasedOnUser();
    }

    function updateUIBasedOnUser() {
      if (!loginBtn || !userName || !logoutBtn) return;
      if (currentUser) {
        loginBtn.style.display = 'none';
        userName.style.display = 'inline';
        userName.textContent = currentUser.email;
        logoutBtn.style.display = 'inline';
      } else {
        loginBtn.style.display = 'inline';
        userName.style.display = 'none';
        logoutBtn.style.display = 'none';
      }
    }

    function resetAuthModal(mode) {
      if (!authError || !modalTitle || !authPassword || !authConfirmPassword || !authSubmitBtn || !toggleMode || !forgotPwd) return;
      authMode = mode;
      authError.style.display = 'none';
      if (mode === 'login') {
        modalTitle.textContent = '登录';
        authPassword.style.display = 'block';
        authConfirmPassword.style.display = 'none';
        authSubmitBtn.textContent = '登录';
        toggleMode.textContent = '还没有账号？去注册';
        forgotPwd.style.display = 'block';
      } else if (mode === 'register') {
        modalTitle.textContent = '注册';
        authPassword.style.display = 'block';
        authConfirmPassword.style.display = 'block';
        authSubmitBtn.textContent = '注册';
        toggleMode.textContent = '已有账号？去登录';
        forgotPwd.style.display = 'none';
      } else if (mode === 'forgot') {
        modalTitle.textContent = '找回密码';
        authPassword.style.display = 'none';
        authConfirmPassword.style.display = 'none';
        authSubmitBtn.textContent = '发送重置邮件';
        toggleMode.textContent = '返回登录';
        forgotPwd.style.display = 'none';
      }
      if (authEmail) authEmail.value = '';
      if (authPassword) authPassword.value = '';
      if (authConfirmPassword) authConfirmPassword.value = '';
    }

    if (loginBtn) loginBtn.addEventListener('click', () => { resetAuthModal('login'); authModal.classList.add('active'); });
    if (closeModal) closeModal.addEventListener('click', () => { authModal.classList.remove('active'); });
    if (toggleMode) toggleMode.addEventListener('click', () => {
      if (authMode === 'login') resetAuthModal('register');
      else if (authMode === 'register') resetAuthModal('login');
      else if (authMode === 'forgot') resetAuthModal('login');
    });
    if (forgotPwd) forgotPwd.addEventListener('click', () => { resetAuthModal('forgot'); });

    authSubmitBtn.addEventListener('click', async () => {
      if (!authError || !authEmail) return;
      authError.style.display = 'none';
      const email = authEmail.value.trim();
      const password = authPassword ? authPassword.value : '';

      if (!email) { authError.textContent = '请输入邮箱'; authError.style.display = 'block'; return; }

      if (authMode === 'login') {
        if (!password) { authError.textContent = '请输入密码'; authError.style.display = 'block'; return; }
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) { authError.textContent = error.message; authError.style.display = 'block'; return; }
        currentUser = data.user;
        authModal.classList.remove('active');
        updateUIBasedOnUser();
      } else if (authMode === 'register') {
        if (!password) { authError.textContent = '请输入密码'; authError.style.display = 'block'; return; }
        const confirmPassword = authConfirmPassword.value;
        if (password !== confirmPassword) { authError.textContent = '两次密码不一致'; authError.style.display = 'block'; return; }
        const { data, error } = await supabaseClient.auth.signUp({ email, password });
        if (error) { authError.textContent = error.message; authError.style.display = 'block'; return; }
        if (data.user && data.session) {
          currentUser = data.user;
          authModal.classList.remove('active');
          updateUIBasedOnUser();
        } else {
          authError.textContent = '注册成功！请检查邮箱并点击确认链接（如果收不到请检查垃圾箱）。';
          authError.style.display = 'block';
        }
      } else if (authMode === 'forgot') {
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email);
        if (error) { authError.textContent = error.message; authError.style.display = 'block'; return; }
        authError.textContent = '已发送重置密码链接到邮箱，请查收。';
        authError.style.display = 'block';
        setTimeout(() => { authModal.classList.remove('active'); }, 3000);
      }
    });

    if (logoutBtn) logoutBtn.addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      currentUser = null;
      updateUIBasedOnUser();
    });

    supabaseClient.auth.onAuthStateChange((event, session) => {
      currentUser = session?.user || null;
      updateUIBasedOnUser();
    });

    // ================= 原有商品加载和展示 =================
    async function loadProducts() {
      try {
        const res = await fetch(API_URL, {
          headers: { 'Authorization': `Bearer ${AIRTABLE_CONFIG.token}` }
        });
        if (!res.ok) throw new Error('网络请求失败');
        const data = await res.json();
        products = data.records.map(record => {
          const f = record.fields;
          const mainImg = (f['主图'] && f['主图'][0]) ? f['主图'][0].url : 'https://placehold.co/700x420/1a1f2b/f0c060?text=暂无图片';
          const otherImgs = (f['其他图片'] || []).map(img => img.url);
          return {
            id: f['编号'] || '无编号',
            recordId: record.id,
            title: f['标题'] || '无标题',
            desc: f['描述'] || '',
            price: f['价格'] || 0,
            server: f['区服'] || '未知区服',
            highestBid: f['最高出价'] || 0,
            images: [mainImg, ...otherImgs]
          };
        });
        renderHome();
        if (window.location.hash) handleHashChange();
        else window.location.hash = '#/';
      } catch (err) {
        console.error(err);
        document.getElementById('productGrid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#6b7280;">数据加载失败，请稍后重试</div>';
      }
    }

    const homePage = document.getElementById('homePage');
    const detailPage = document.getElementById('detailPage');
    const productGrid = document.getElementById('productGrid');
    const totalCountSpan = document.getElementById('totalCount');
    const searchInput = document.getElementById('searchInput');
    const detailContent = document.getElementById('detailContent');
    const backBtn = document.getElementById('backBtn');
    const sellBtn = document.getElementById('sellBtn');

    sellBtn.addEventListener('click', () => {
      if (!currentUser) {
        alert('请先登录后再卖账号');
        resetAuthModal('login');
        authModal.classList.add('active');
        return;
      }
      alert('请联系客服微信：csy212886226 办理卖账号业务');
    });

    function truncate(str, len=30) { return str && str.length > len ? str.slice(0,len)+'...' : str||''; }
    let currentRoute = 'home', currentProductId = null;

    function renderHome(filterText='') {
      const kw = filterText.trim().toLowerCase();
      const filtered = products.filter(p => !kw || p.id.toLowerCase().includes(kw) || p.title.toLowerCase().includes(kw) || p.desc.toLowerCase().includes(kw) || (p.server||'').toLowerCase().includes(kw));
      totalCountSpan.textContent = filtered.length;
      if (!filtered.length) { productGrid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#6b7280;">没有找到匹配的账号</div>'; return; }
      productGrid.innerHTML = filtered.map(p => `
        <div class="product-card" data-product-id="${p.id}">
          <div class="card-img"><img src="${p.images[0]}" alt="${p.id}"></div>
          <div class="card-body">
            <div class="product-id">📌 ${p.id}</div>
            <div class="product-title">${truncate(p.title)}</div>
            <div class="product-desc">${truncate(p.desc)}</div>
            <div class="product-server">🌐 ${p.server}</div>
            <div class="product-footer"><span class="price">¥${p.price}</span><button class="btn-sm">查看详情</button></div>
          </div>
        </div>
      `).join('');
      document.querySelectorAll('.product-card').forEach(c => c.addEventListener('click', () => navigateToDetail(c.dataset.productId)));
    }

    function renderDetail(pid) {
      const p = products.find(x => x.id === pid);
      if (!p) { navigateToHome(); return; }
      currentProductId = pid;
      const images = p.images || [];
      const mainImg = images[0] || 'https://placehold.co/700x420/1a1f2b/f0c060?text=暂无图片';
      const thumbs = images.map((img,i) => `<img src="${img}" class="thumb ${i===0?'active':''}" data-index="${i}" alt="缩略图">`).join('');
      const currentBid = p.highestBid || 0;
      const bidDisplay = currentBid > 0 ? `¥${currentBid}` : '暂无出价';

      detailContent.innerHTML = `
        <div class="detail-gallery"><img src="${mainImg}" class="main-img" id="mainImg"><div class="thumb-list">${thumbs}</div></div>
        <div class="detail-info">
          <h1>${truncate(p.title)}</h1>
          <div class="detail-price">¥${p.price}</div>
          <div class="bid-section">
            <div class="bid-current">当前最高出价：<span id="currentBid">${bidDisplay}</span></div>
            <div class="bid-form">
              <input type="number" id="bidInput" placeholder="输入你的出价" min="1" step="0.01">
              <button id="submitBidBtn">我要出价</button>
            </div>
            <div class="bid-error" id="bidError"></div>
          </div>
          <div class="detail-desc">${p.desc}</div>
          <div class="detail-meta"><div class="meta-item"><div class="label">商品编号</div><div class="value">${p.id}</div></div><div class="meta-item"><div class="label">所在区服</div><div class="value">${p.server}</div></div></div>
          <button class="buy-btn" id="buyBtn">💬 联系客服购买</button>
          <div class="contact-row"><span>📱 客服微信：csy212886226</span></div>
        </div>
      `;

      document.querySelectorAll('#thumbList .thumb').forEach(thumb => {
        thumb.addEventListener('click', function() {
          const index = parseInt(this.dataset.index, 10);
          if (images[index]) {
            document.getElementById('mainImg').src = images[index];
            document.querySelectorAll('#thumbList .thumb').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
          }
        });
      });

      document.getElementById('buyBtn').addEventListener('click', () => alert('请联系客服微信：csy212886226 完成购买'));

      const bidInput = document.getElementById('bidInput');
      const submitBtn = document.getElementById('submitBidBtn');
      const errorEl = document.getElementById('bidError');
      const currentBidSpan = document.getElementById('currentBid');

      submitBtn.addEventListener('click', async () => {
        if (!currentUser) {
          errorEl.textContent = '请先登录后才能出价';
          errorEl.style.display = 'block';
          return;
        }
        const bidValue = parseFloat(bidInput.value);
        if (isNaN(bidValue) || bidValue <= 0) {
          errorEl.textContent = '请输入有效的出价金额';
          errorEl.style.display = 'block';
          return;
        }
        if (bidValue <= currentBid) {
          errorEl.textContent = '出价必须高于当前最高出价';
          errorEl.style.display = 'block';
          return;
        }
        if (bidValue > p.price) {
          errorEl.textContent = `出价不能超过商品标价 ¥${p.price}`;
          errorEl.style.display = 'block';
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = '提交中...';
        errorEl.style.display = 'none';

        try {
          const patchUrl = `https://api.airtable.com/v0/${AIRTABLE_CONFIG.baseId}/${encodedTable}/${p.recordId}`;
          const res = await fetch(patchUrl, {
            method: 'PATCH',
            headers: {
              'Authorization': `Bearer ${AIRTABLE_CONFIG.token}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ fields: { '最高出价': bidValue } })
          });
          if (!res.ok) throw new Error('出价失败');
          p.highestBid = bidValue;
          currentBidSpan.textContent = `¥${bidValue}`;
          bidInput.value = '';
          alert('出价成功！');
        } catch (err) {
          console.error(err);
          errorEl.textContent = '出价失败，请稍后重试';
          errorEl.style.display = 'block';
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = '我要出价';
        }
      });
    }

    function navigateToHome() { currentRoute='home'; currentProductId=null; homePage.classList.add('active'); detailPage.classList.remove('active'); window.location.hash='#/'; renderHome(searchInput.value); }
    function navigateToDetail(pid) { currentRoute='detail'; currentProductId=pid; homePage.classList.remove('active'); detailPage.classList.add('active'); window.location.hash=`#/detail/${pid}`; renderDetail(pid); window.scrollTo({top:0,behavior:'smooth'}); }
    searchInput.addEventListener('input', e => { if (currentRoute==='home') renderHome(e.target.value); });
    backBtn.addEventListener('click', navigateToHome);

    function handleHashChange() {
      const m = window.location.hash.match(/^#\/detail\/(.+)/);
      if (m) {
        const pid=m[1];
        if (products.some(p => p.id===pid)) {
          if (currentRoute!=='detail'||currentProductId!==pid) {
            homePage.classList.remove('active');
            detailPage.classList.add('active');
            renderDetail(pid);
            currentRoute='detail';
            currentProductId=pid;
          }
        } else navigateToHome();
      } else {
        if (currentRoute!=='home') {
          homePage.classList.add('active');
          detailPage.classList.remove('active');
          renderHome(searchInput.value);
          currentRoute='home';
          currentProductId=null;
        }
      }
    }
    window.addEventListener('hashchange', handleHashChange);

    // 启动
    checkUser().then(() => {
      loadProducts();
    });
  </script>
</body>
</html>
